<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ venue.name }} — SilentZone QR Poster</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F6F4EE; color: #101D33; }
    .font-editorial { font-family: 'Instrument Serif', serif; }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
  <div class="print:hidden mb-6 flex gap-3">
    <button onclick="window.print()" class="bg-[#101D33] text-white px-5 py-2.5 rounded-full text-sm font-semibold">Print / Save as PDF</button>
    <a href="/v/{{ venue.venue_id }}" class="px-5 py-2.5 rounded-full text-sm border border-[#101D33]/20">Back to Venue</a>
  </div>
  <div class="bg-white border-2 border-[#101D33] rounded-3xl max-w-lg w-full p-10 text-center space-y-6 shadow-sm">
    <p class="font-mono-code text-xs tracking-widest uppercase text-[#C46D3B]">SilentZone · Quiet by Design</p>
    <h1 class="font-editorial text-5xl">{{ venue.name }}</h1>
    <p class="text-sm text-[#556070]">Scan once to silence your phone automatically during quiet hours—no app install, no GPS tracking, emergency calls stay safe.</p>
    <img src="{{ qr_uri }}" alt="QR Code" class="w-60 h-60 mx-auto border border-[#DFD9CC] rounded-2xl p-3" />
    <div class="bg-[#F6F4EE] rounded-2xl p-4 space-y-1">
      <p class="text-xs text-[#556070]">Venue Wi-Fi Beacon</p>
      <p class="font-mono-code text-lg font-semibold">{{ venue.ssid }}</p>
    </div>
    <p class="text-xs text-[#556070]">Works natively with Android Modes &amp; Routines and Apple iOS Focus</p>
  </div>
</body>
</html>
